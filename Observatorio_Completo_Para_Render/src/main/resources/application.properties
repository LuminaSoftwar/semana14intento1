spring.application.name=observatorio-mininter
spring.thymeleaf.cache=false
server.port=${PORT:8080}
server.address=0.0.0.0
server.error.include-stacktrace=never

# Access LOG de Tomcat integrado. Patrón sin IP ni query string.
server.tomcat.accesslog.enabled=${ACCESS_LOG_ENABLED:true}
server.tomcat.accesslog.directory=${ACCESS_LOG_DIR:logs}
server.tomcat.accesslog.prefix=access_log
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%t %m %U %H %s %b %D

# ID público de medición GA4 del flujo Web del Observatorio.
# Puede sobrescribirse en Render con GA4_MEASUREMENT_ID; no es una credencial secreta.
observatorio.ga4.measurement-id=${GA4_MEASUREMENT_ID:G-NLDXNKD0T1}
