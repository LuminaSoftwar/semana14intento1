<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso administrador</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container py-5" style="max-width:460px"><h1 class="h3">Acceso de administración</h1><p th:if="${param.error}" class="alert alert-danger">Credenciales incorrectas.</p><form method="post" action="/login" class="card p-4"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label for="username" class="form-label">Usuario</label><input id="username" name="username" class="form-control mb-3" required><label for="password" class="form-label">Contraseña</label><input id="password" name="password" type="password" class="form-control mb-3" required><button class="btn btn-primary">Iniciar sesión</button></form><a href="/dashboard" class="d-block mt-3">Volver al dashboard ciudadano</a></main></body></html>
